# Zigbee 开关 → 餐厅灯
#
# 这是 HA 那台机器上 /opt/ha/config/automations.yaml 里那条自动化的**可读副本**。
# 真正生效的是机器上那份（`configuration.yaml` 里 `automation: !include automations.yaml`），
# 这份留在仓库里是为了能被 review、被 diff、被讲清楚。改了这份记得同步过去，
# 反过来也一样。
#
# ⚠️ 这条自动化目前是**停用状态**（HA 里 automation.zigbee_kai_guan_can_ting_deng
#   已 turn_off），因为它指着的那个设备**不是开关**。别急着启用，先看下面。
#
# 触发器为什么是 binary_sensor 而不是 zha_event：
#   这只设备的按键信息只存在于 binary_sensor 的状态位里，事件总线上什么都没有
#   （zigpy 对 IAS Zone 的 status_change_notification 没有命令处理器，
#   日志原文 `No explicit handler for cluster command 0x00`，ZHA 不会转成
#   zha_event）。所以只能用 state 类型的触发器，改成 event 类型是死路。
#
# 为什么只抓 off → on 这一个方向（2026-08-13 13:23 抓帧后改的）：
#   实测每按一次，设备是这么一套动作 ——
#
#     13:23:30.169  joined the network              设备上电、重新入网
#     13:23:30.451  IasZone(zone_status=Test)       → binary_sensor = off
#     13:23:31.291  IasZone(zone_status=Alarm_1)    → binary_sensor = on
#     13:23:32.016  IasZone(zone_status=Alarm_1)    重发，同值
#     13:23:35.165  IasZone(zone_status=Alarm_1)    重发，同值
#
#   `Test`(bit 8) 是它上电自检报的，`Alarm_1`(bit 0) 才是"我被按了"。
#   也就是说**一次按压会产生两个边沿**：on→off（自检）和 off→on（按键）。
#
#   ⚠️ 这正是之前"按了没反应"的第二个原因（第一个是协调器 IP 漂了）：
#   老版本两个方向都当按键，于是一次按压把灯 toggle 了两次，净效果为零。
#   现在只认 off → on 那一个边沿，一次按压正好触发一次。
#
#   写死 from/to 仍然是刻意的：不这么写的话，设备掉线再上线
#   （unavailable → on）也会被当成一次按键。
#
#   后面那两帧重发不会造成重复触发 —— 值没变，ZHA 干脆不写状态
#   （连 last_reported 都不动），HA 这层根本看不见。
#
# 实测结果（2026-08-13 00:30 前后）：
#   配进来的 `LH79221` 从 ZHA 读到的指纹是 **IAS Zone 安防传感器**
#   （端点 device_type `0x0402`、输入簇 `0x0500`，ZHA 给的端点名就叫
#   `IAS_ZONE`），身上**没有任何开关该有的簇**（OnOff / Multistate）。
#   它是电池设备，在线、信号很好（LQI 156 / RSSI −61），但除了入网那一次
#   `off → on` 之外**再没上报过任何状态**，人按它 HA 这边收不到东西。
#
#   也就是说：链路断在最上游，跟这条自动化无关。灯那头是好的，实测可控。
#
# 补充实测（2026-08-13 12:02，深度日志抓到原始帧后）：
#   上面那句"没有开关该有的簇"不等于"它不是开关"。这一族廉价无线按钮就是
#   借 IAS Zone 的告警位上报按压的 —— 抓到的原始帧是
#   `status_change_notification(zone_status=Alarm_1)`，那正是"我被按了"。
#
#   但**它不会发 `zha_event`**：zigpy 对这条簇命令没有处理器
#   （日志原文 `No explicit handler for cluster command 0x00`），
#   所以按键信息只存在于 `binary_sensor` 的状态位里，事件总线上什么都没有。
#   → 触发器**只能**是这里的 state 类型，改成 event 类型是死路。
#
#   遗留问题：它按完 latch 在 `on` 上，重复按同一动作至少在 HA 这层看不到
#   任何东西。所以这条自动化即便启用也可能"只灵一次"。根治要给它配 ZHA
#   quirk 做自动复位（`reset_s`），细节见 README.md。
#
# 为什么停用而不是留着：
#   如果这只 `LH79221` 其实是门窗磁 / 人体感应，那开门或走过去就会翻转
#   `binary_sensor`，餐厅灯会**自己动**。那正是家规里"只做氛围和提示、
#   不做自动开关灯"要禁的事。设备身份确认之前，宁可停着。
#
# 要启用之前必须先确认：这只 `LH79221` 到底是不是人要按的那个开关。
#   人坚持说是（"大大的按钮、单个按键、自回弹"），原始帧也跟按钮相符，
#   但还没到可以拿家里的灯去赌的程度 —— 等连按 3 下的帧数据到了再定。
#
# 家规：只响应人的按键，不做任何状态巡检、不定时纠正、不跟手动操作抢。
#   mode: single 是为了连按时不叠加执行。

- id: zigbee_switch_dining_light_toggle
  alias: Zigbee 开关 → 餐厅灯
  description: 按一下那个 Zigbee 开关，餐厅灯翻一次。只认 Alarm_1 那一个边沿，不认自检那一下。
  mode: single
  # 设备会把 Alarm_1 重发几次。真要有边沿挤在一起时，宁可静默丢弃也不要在
  # 日志里刷 "already running" 警告 —— 这条自动化的语义是「按一下翻一次」，
  # 落下一次远比多翻一次好。
  max_exceeded: silent
  triggers:
    - trigger: state
      entity_id: binary_sensor.lh79221
      from: "off"
      to: "on"
  actions:
    - action: light.toggle
      target:
        entity_id: light.yeelink_cn_56292508_mono1_s_2_light
